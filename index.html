<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LucilaPortfolio/assets/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lucila Martínez — Strategic Product Designer. Case studies in growth, retention, and experimentation." />
    <title>Lucila Martínez — Product Designer</title>

    <!-- Open Graph / Twitter share preview — public/og-image.png is a static render (see
         src/features/music's gradient theme for the background) since a share crawler
         fetches this tag directly and can't reflect a viewer's own live toggle state. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucilamtz90.github.io/LucilaPortfolio/" />
    <meta property="og:title" content="Lucila Martínez — Product Designer" />
    <meta property="og:description" content="Strategic Product Designer. Case studies in growth, retention, and experimentation." />
    <meta property="og:image" content="https://lucilamtz90.github.io/LucilaPortfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lucila Martínez — Product Designer" />
    <meta name="twitter:description" content="Strategic Product Designer. Case studies in growth, retention, and experimentation." />
    <meta name="twitter:image" content="https://lucilamtz90.github.io/LucilaPortfolio/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600&family=SUSE+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Counterpart to public/404.html's redirect: decodes the encoded path
         back into a real URL before react-router mounts. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
