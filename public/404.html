<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lucila Martínez — Product Designer</title>
    <!--
      GitHub Pages SPA redirect (https://github.com/rafgraph/spa-github-pages).
      GH Pages serves this file for any unknown path; it re-encodes that path
      into a query string and redirects to index.html, where the inline script
      in index.html decodes it back so react-router can render the right route.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
